<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>CareerTrack</title>
    <!-- Sets the theme before the first paint, so a dark-mode user never sees a white flash while the app loads. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('careertrack_theme');
          var dark =
            saved === 'dark' ||
            ((saved === null || saved === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
